<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common(#{title.editMypage})}"></th:block>
</head>

<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>

    <main>
        <!-- errorMessage 에는 문장이 아니라 사전 키가 들어 있다. (예: member.nicknameTaken, service/MemberService.java)
             #{${키가 든 변수}} : 변수 값을 키로 써서 사전에서 문장을 찾는다. -->
        <p th:if="${errorMessage != null}" th:text="#{${errorMessage}}"></p>

        <form th:action="@{/mypage/edit}" th:object="${memberForm}" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend th:text="#{editMypage.legend}">회원정보 수정</legend>
                <p>
                    <label for="id" th:text="#{member.id}">아이디:</label><br>
                    <input type="text" th:field="*{id}" id="id" readonly>
                </p>
                <p>
                    <label for="username" th:text="#{member.username}">이름:</label><br>
                    <input type="text" th:field="*{username}" id="username" required>
                </p>
                <p>
                    <label for="profileImage" th:text="#{member.profileImage}">프로필 이미지:</label><br>
                    <input type="file" name="profileImage" id="profileImage" accept="image/*">
                    <br>
                    <img id="profileImagePreview"
                         style="display: none;"
                         alt=""
                         width="100"
                         height="100">
                </p>
                <p>
                    <label for="nickname" th:text="#{member.nickname}">닉네임:</label><br>
                    <input type="text" th:field="*{nickname}" id="nickname" required>
                </p>

                <p>
                    <label for="phoneNumber" th:text="#{member.mobilePhone}">휴대전화:</label><br>
                    <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required>
                </p>

                <p>
                    <label for="email" th:text="#{member.email}">이메일:</label><br>
                    <input type="email" th:field="*{email}" id="email" required>
                </p>

                <p>
                    <label for="address" th:text="#{member.address}">주소:</label><br>
                    <input type="text" th:field="*{address}" id="address" readonly required>
                    <button type="button" id="searchAddress" th:text="#{member.searchAddress}">주소 검색</button>
                </p>

                <button type="submit" th:text="#{editMypage.save}">저장</button>
                <a th:href="@{/mypage}" th:text="#{editMypage.cancel}">취소</a>
            </fieldset>
        </form>
    </main>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:src="@{/js/member/addressSearch.js}"></script>
    <script th:src="@{/js/member/profileImagePreview.js}"></script>
</body>

</html>
