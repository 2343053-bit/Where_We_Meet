<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>참가자 위치 입력</title>
    <style>
        #form-results {
            display: grid;
            grid-template-columns: minmax(260px, 320px) minmax(280px, 1fr);
            gap: 16px;
            align-items: start;
        }

        #participants fieldset {
            display: grid;
            gap: 8px;
            margin-bottom: 8px;
        }

        #participants input {
            width: 100%;
        }

        #results {
            padding: 0 16px;
            border: 1px solid #aaa;
        }

        @media (max-width: 700px) {
            #form-results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<a href="/login">로그인</a>
<a href="/signup">회원가입</a>
<div id="map" style="width: 100%; height: 70vh;"></div>
<p id="current-location-status" role="status" hidden></p>
<!-- 장소 검색 기능은 기본 지도에 들어 있지 않아서 libraries='services' 를 추가해야 한다. -->
<script th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoJsKey},libraries='services')}"></script>
<!-- 다음(카카오) 우편번호 서비스. "주소 검색" 버튼을 누르면 뜨는 주소 검색 팝업(daum.Postcode)을 쓰려고 추가했다. (키 필요 없음) -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<hr>
<div id="form-results">
<!-- id="participantForm" : 아래 스크립트에서 제출 이벤트를 가로채려고 폼에 id 를 붙였다. -->
<form id="participantForm" th:action="@{/main}" th:object="${participantForm}" method="post">
    <div id="participants">
        <!-- 위도·경도를 직접 입력하던 칸을 주소 입력칸 + 주소 검색 버튼으로 바꿨다.
        - 주소 칸(.address) : 주소 검색 팝업으로만 채운다. (readonly → 직접 입력 금지)
                              name 이 없어서 서버로는 전송되지 않는다. (ParticipantLocation 에 address 필드가 없음)
        - 위도·경도 칸     : type="hidden" 으로 숨겨 두고, 제출할 때 스크립트가 주소를 좌표로 바꿔서 채운다.
                              서버는 기존처럼 위도·경도만 받으므로 컨트롤러는 수정할 필요가 없다. -->
        <fieldset>
            <legend>참가자 1</legend>
            <input type="text" th:field="*{participants[0].participantName}" placeholder="이름" required>
            <input type="text" class="address" placeholder="주소 (예: 부산 사하구 낙동대로 550)" readonly required>
            <button type="button" class="searchAddress">주소 검색</button>
            <input type="hidden" th:field="*{participants[0].latitude}">
            <input type="hidden" th:field="*{participants[0].longitude}">
        </fieldset>

        <fieldset>
            <legend>참가자 2</legend>
            <input type="text" th:field="*{participants[1].participantName}" placeholder="이름" required>
            <input type="text" class="address" placeholder="주소 (예: 부산 사하구 낙동대로 550)" readonly required>
            <button type="button" class="searchAddress">주소 검색</button>
            <input type="hidden" th:field="*{participants[1].latitude}">
            <input type="hidden" th:field="*{participants[1].longitude}">
        </fieldset>
    </div>

    <button type="button" id="removeParticipant">-</button>
    <button type="button" id="addParticipant">+</button>
    <button type="submit">제출</button>
</form>

<section id="results" th:if="${meetingPoint != null}">
    <!-- 참가자의 이름과 위치를 표시하는 부분
    <div th:each="participant, stat : ${participants}">
        <h3 th:text="|참가자 ${stat.count}|"></h3>
        <p>이름: <span th:text="${participant.participantName}"></span></p>
        <p>위도: <span th:text="${participant.latitude}"></span></p>
        <p>경도: <span th:text="${participant.longitude}"></span></p>
    </div>
    -->
    <h3>참가자 평균 위치</h3>
    <p>평균 위도: <span th:text="${meetingPoint.meetingLatitude}"></span></p>
    <p>평균 경도: <span th:text="${meetingPoint.meetingLongitude}"></span></p>
</section>
</div>
<!-- 지도 스크립트는 반드시 폼 "뒤"에 둔다. 폼 앞에 긴 스크립트가 있으면 Thymeleaf 가 화면을 먼저 보내 버려서
     폼의 보안 토큰(CSRF)을 못 만들고 화면이 잘린다. ("Cannot create a session after the response has been committed") -->
	<!-- th:inline="javascript" : 이 <script> 안에서도 Thymeleaf 가 서버 값을 넣어 주도록 켜는 설정
    (없으면 아래 /*[[...]]*/ 부분이 그대로 브라우저로 가서 주석 취급 → 값이 항상 null.) -->
	<script th:inline="javascript">
		var container = document.getElementById('map');
		var options = {
			center: new kakao.maps.LatLng(35.117, 128.968),
			level: 3
		};

        var map = new kakao.maps.Map(container, options); //지도 생성.

        // 지도 생성 직후 현재 위치를 한 번 요청한다.
        // 별도 함수 범위로 감싸 참가자 입력 폼의 변수와 충돌하지 않게 한다.
        (function showCurrentLocationOnMap(locationMap, statusElement) {
        	// 브라우저에서 위치를 받으면 좌표로 마커와 안내창을 만들고 지도 중심을 이동한다.
        	function displayCurrentLocation(position) {
        		var currentLocationPosition = new kakao.maps.LatLng(
        			position.coords.latitude,
					position.coords.longitude
				);
				var currentLocationMarker = new kakao.maps.Marker({
					map: locationMap,
					position: currentLocationPosition
				});
				var currentLocationInfoWindow = new kakao.maps.InfoWindow({
					content: '<div style="padding:5px;">여기에 계신가요?!</div>',
					removable: true
				});

				currentLocationInfoWindow.open(locationMap, currentLocationMarker);
				locationMap.setCenter(currentLocationPosition);
			}

			// 위치 권한 거부, 응답 시간 초과 등 실패 사유를 지도 아래에 표시한다.
			function displayLocationError(error) {
				statusElement.hidden = false;
				if (error.code === error.PERMISSION_DENIED) {
					statusElement.textContent = '현재 위치 권한을 허용해주세요.';
				} else if (error.code === error.TIMEOUT) {
					statusElement.textContent = '현재 위치 확인 시간이 초과되었습니다.';
				} else {
					statusElement.textContent = '현재 위치를 가져오지 못했습니다.';
				}
			}

			// Geolocation API는 보안 연결에서만 사용할 수 있으므로 실행 전에 환경을 확인한다.
			if (!window.isSecureContext) {
				statusElement.hidden = false;
				statusElement.textContent = '현재 위치 기능은 HTTPS 또는 localhost에서 사용할 수 있습니다.';
			} else if (!navigator.geolocation) {
				statusElement.hidden = false;
				statusElement.textContent = '이 브라우저는 현재 위치 기능을 지원하지 않습니다.';
			} else {
				// 위치 조회는 비동기이므로 지도는 먼저 표시되고, 좌표를 받으면 마커와 중심이 갱신된다.
				navigator.geolocation.getCurrentPosition(
					displayCurrentLocation,
					displayLocationError
				);
			}
		})(map, document.getElementById('current-location-status')); // 지도와 안내 문구 요소를 위치 처리 함수에 전달한다.

		// 마커 위치들을 모아 둘 범위 상자. 나중에 이 범위가 다 보이게 지도를 맞춘다.
		var bounds = new kakao.maps.LatLngBounds();

		var meetingLat = /*[[${meetingPoint?.meetingLatitude}]]*/ null; // 얘네 때문에 th:inline="javascript" 를 작성했다.
		var meetingLng = /*[[${meetingPoint?.meetingLongitude}]]*/ null;

		// 제출해서 중간 지점이 계산된 경우에만 마커를 찍는다.
		if (meetingLat != null) {
			var markerPosition = new kakao.maps.LatLng(meetingLat, meetingLng);  // 마커 위치. (위도, 경도 순) ← 마커보다 먼저 만들어야 한다.

			// 중간 지점은 노란 마커 이미지로 표시해서 참가자 마커(기본 파란 마커)와 구분한다.
			var imageSrc = 'https://t1.kakaocdn.net/localimg/localimages/07/mapapidoc/markerStar.png'; // 마커 이미지 주소. (카카오 샘플의 노란 별 마커) 
            // 다른 그림을 쓰려면 위 줄과 아래 두 줄(크기, offset)을 그림에 맞게 바꾼다.
            var imageSize = new kakao.maps.Size(24, 35);                    // 마커 이미지 크기. (가로, 세로 px)
			var imageOption = { offset: new kakao.maps.Point(12, 35) };     // 이미지의 어느 점을 좌표에 맞출지. (가로 가운데 12, 맨 아래 35 = 핀의 뾰족한 끝)
			var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);           // 마커 이미지 생성.
			var marker = new kakao.maps.Marker({ position: markerPosition, image: markerImage });     // 마커 생성.

			marker.setMap(map);                                                  // 지도 위에 올리기.
			map.setCenter(markerPosition);                                       // 지도 중심도 중간 지점으로 이동.
			bounds.extend(markerPosition);                                       // 범위 상자에 중간 지점 추가.

            // 중간 지점 마커 위에 "중간 지점" 말풍선 표시.
			var infowindow = new kakao.maps.InfoWindow({
				position: markerPosition,                             // 말풍선 위치.
				content: '<div style="padding:5px;">중간 지점</div>' // 말풍선 내용. -----------------------추후 html 태그로 바꿔서 참가자 이름과 평균 위치를 표시하도록 수정 가능.
			});
			infowindow.open(map, marker);                             // marker 위에 말풍선 열기.
		}
        // ── 참가자 위치 마커 ───────────────────────
		//   참가자 목록을 JS 배열로 받는다.
		//   participantForm 은 컨트롤러의 @ModelAttribute 가 화면에 자동으로 넘겨 주는 폼 객체를 사용했음.
		//   나중에 컨트롤러 39번 줄 주석을 풀면, 화면의 participantForm?.participants를 participants로 바꾸기만 하면 됨.
		//   서버가 처리하면 [{"participantName":"철수","latitude":37.5,"longitude":127.0}, ...] 모양이 된다.

		var participantList = /*[[${participantForm?.participants}]]*/ []; // 아래 +/- 버튼 코드의 participants 와 이름이 겹치면 버튼이 동작하지 않아서 participantList 로 지음.

		// 참가자 수만큼 반복.
		for (var i = 0; i < participantList.length; i++) { // participantList.length 는 참가자 수, participantList[i] 는 i 번째 참가자. (0부터 셈.)

			// 처음 접속하면 빈 입력칸(위도·경도 null)이 2개 있으므로 건너뛴다.
			if (participantList[i].latitude == null || participantList[i].longitude == null) {
				continue;
			}

			// 마커 생성. map: map 으로 바로 지도에 올린다.
			var marker = new kakao.maps.Marker({
				map: map,                                                                              // 마커를 표시할 지도.
				position: new kakao.maps.LatLng(participantList[i].latitude, participantList[i].longitude),  // 참가자 위치. (위도, 경도 순.)
				title: participantList[i].participantName                                                    // 마우스를 올리면 이름 표시.
			});

            bounds.extend(marker.getPosition()); // 범위 상자에 방금 만든 마커의 위치 추가.

			// 참가자 마커 위에 이름 말풍선 표시.
			var infowindow = new kakao.maps.InfoWindow({
				position: marker.getPosition(),                                                         // 말풍선 위치.
				content: '<div style="padding:5px;">' + participantList[i].participantName + '</div>'  // 말풍선 내용. 이름을 글자 사이에 끼워 넣음.
			});
			infowindow.open(map, marker);                                                               // marker 위에 말풍선 열기.
		}
        // 범위 상자에 좌표가 하나라도 있으면 그 좌표들이 다 보이게 지도 범위를 맞춘다.
		// 처음 접속하면 상자가 비어 있으므로 건너뛴다.
		if (!bounds.isEmpty()) {
			map.setBounds(bounds); // 지도의 중심과 확대 레벨이 자동으로 바뀐다.
		}

        // ── 중간 지점 주변 장소 검색 ───────────────────────
		if (meetingLat != null) {
			var placeInfowindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 장소 마커를 클릭하면 장소 이름을 보여 줄 말풍선. (하나를 돌려 씀) zIndex 는 다른 말풍선보다 위에 보이게.
			var ps = new kakao.maps.services.Places();                       // 장소 검색 객체 생성.

			// '카페' 를 검색한다. 검색이 끝나면 placesSearchCB 함수가 실행된다. (콜백)
			ps.keywordSearch('카페', placesSearchCB, {                       // 지금은 '카페' 고정. 폼에 장소 종류 입력칸(keyword)이 생기면 '카페' 대신 participantForm 의 keyword 값을 넣도록 바꾼다.
			                                                                 // (주의: th:inline 안에서는 주석 속에 서버 값 넣는 대괄호 두 개 문법을 쓰면 Thymeleaf 가 실제로 실행해서 에러가 난다.)
				location: new kakao.maps.LatLng(meetingLat, meetingLng),     // 검색 기준 위치. (중간 지점)
				radius: 1000,                                                // 기준 위치에서 1000m 안에서만 찾는다.
				sort: kakao.maps.services.SortBy.DISTANCE                    // 가까운 순서로 정렬한다.
			});
		}

		// 검색이 끝나면 카카오가 호출해 주는 함수. data = 검색된 장소 목록, status = 검색 결과 상태.
		function placesSearchCB(data, status, pagination) {
			if (status === kakao.maps.services.Status.OK) {   // 검색 결과가 있을 때만.
				for (var i = 0; i < data.length; i++) {        // 검색된 장소 수만큼 반복.
					displayMarker(data[i]);                    // i 번째 장소의 마커를 만든다.
				}
			}
		}

		// 장소 하나(place)를 받아 지도에 마커를 표시하는 함수.
		function displayMarker(place) {
			var marker = new kakao.maps.Marker({
				map: map,                                                // 마커를 표시할 지도.
				position: new kakao.maps.LatLng(place.y, place.x)        // 장소 위치. y 가 위도, x 가 경도라서 y 를 먼저 넣는다. LatLng 얘 위도부터받음.
			});

			// 마커를 클릭하면 장소 이름을 말풍선에 보여 준다.
			kakao.maps.event.addListener(marker, 'click', function() {
				placeInfowindow.setContent('<div style="padding:5px;font-size:12px;">' + place.place_name + '</div>'); // 말풍선 내용을 이 장소 이름으로 바꾼다.
				placeInfowindow.open(map, marker);                                                                     // 클릭한 마커 위에 연다.
			});
		}
	</script>
<script>
    const participants = document.getElementById("participants");
    const addButton = document.getElementById("addParticipant");
    const removeButton = document.getElementById("removeParticipant");
    const minParticipants = 2;
    const maxParticipants = 5;

    function updateButtons() {
        const count = participants.children.length;
        addButton.disabled = count >= maxParticipants;
        removeButton.disabled = count <= minParticipants;
    }

    addButton.addEventListener("click", () => {
        const index = participants.children.length;
        const fieldset = document.createElement("fieldset");
        const legend = document.createElement("legend");
        legend.textContent = `참가자 ${index + 1}`;
        fieldset.appendChild(legend);

        // + 버튼으로 추가되는 참가자 칸도 위의 고정 칸(참가자 1, 2)과 같은 모양이 되도록 맞췄다.
        // (이름 → 주소 + 주소 검색 버튼 → 숨김 위도 → 숨김 경도)
        // 주소 칸에도 name 이 붙지만 ParticipantLocation 에 address 필드가 없어서 서버에서는 무시된다.
        [
            { property: "participantName", type: "text",   placeholder: "이름" },
            { property: "address",         type: "text",   placeholder: "주소" },
            { property: "latitude",        type: "hidden" },
             { property: "longitude",       type: "hidden" }
        ].forEach((field) => {
            const input = document.createElement("input");
            input.type = field.type;
            input.name = `participants[${index}].${field.property}`;

            if (field.type !== "hidden") {            // 숨김 칸에는 placeholder 와 required 를 붙이지 않는다.
                input.placeholder = field.placeholder;
                input.required = true;
            }

            fieldset.appendChild(input);

            if (field.property === "address") {       // 주소 칸이면
                input.className = "address";          // 제출 코드가 이 클래스로 찾는다.
                input.readOnly = true;                // 직접 입력 금지

                const searchButton = document.createElement("button");
                searchButton.type = "button";         // 없으면 누를 때 폼이 제출된다.
                searchButton.className = "searchAddress";
                searchButton.textContent = "주소 검색";
                fieldset.appendChild(searchButton);   // 주소 칸 바로 뒤에 버튼
            }

            fieldset.appendChild(document.createTextNode(" "));
        });

        participants.appendChild(fieldset);
        updateButtons();
    });

    removeButton.addEventListener("click", () => {
        if (participants.children.length > minParticipants) {
            participants.lastElementChild.remove();
            updateButtons();
        }
    });

    updateButtons();

    // ── 제출 시 주소 → 좌표 변환 ───────────────────────
    //   화면에서는 주소만 받고, 서버에는 기존처럼 위도·경도를 보낸다.
    //   제출 버튼을 누르면 바로 보내지 않고, 참가자마다 주소를 좌표로 바꿔 숨김 칸에 채운 뒤에 제출한다.
    //   Geocoder 도 장소 검색처럼 libraries='services' 에 들어 있다.
    const form = document.getElementById("participantForm");
    const geocoder = new kakao.maps.services.Geocoder(); // 주소 → 좌표 변환 객체 생성.

    form.addEventListener("submit", (e) => {
        e.preventDefault();                                   // 일단 제출을 막는다.
        const fieldsets = participants.querySelectorAll("fieldset"); // 참가자 칸 목록. (+/- 로 늘어난 칸 포함)
        let done = 0;                                                // 좌표 변환이 끝난 참가자 수.
        let failed = false;                                          // 한 명이라도 실패하면 true → 제출하지 않고, 알림도 한 번만 띄운다.

        fieldsets.forEach((fs, i) => {
            const address = fs.querySelector(".address").value;
            if (!address) {                                     // readonly 칸은 required 검사가 안 되므로 직접 확인.
                if (!failed) alert(`참가자 ${i + 1}의 주소를 검색해 주세요.`);
                failed = true;
                return;
            }
            geocoder.addressSearch(address, (result, status) => {   // 비동기: 결과가 나중에 온다.
                if (failed) return;
                if (status !== kakao.maps.services.Status.OK) {
                    failed = true;
                    alert(`참가자 ${i + 1}의 주소를 찾을 수 없습니다.`);
                    return;
                }
                fs.querySelector(`[name="participants[${i}].latitude"]`).value  = result[0].y; // y = 위도
                fs.querySelector(`[name="participants[${i}].longitude"]`).value = result[0].x; // x = 경도
                done++;
                if (done === fieldsets.length) form.submit();     // 전부 끝나면 진짜 제출. (form.submit() 은 submit 이벤트를 다시 부르지 않아서 무한 반복되지 않는다.)
            });
        });
    });

    // ── 주소 검색 버튼 ───────────────────────
    //   버튼마다 이벤트를 붙이지 않고 부모(#participants)에 한 번만 붙였다. (이벤트 위임)
    //   그래서 + 버튼으로 나중에 추가된 참가자의 주소 검색 버튼도 따로 코드 없이 동작한다.
    participants.addEventListener("click", (e) => {
        if (!e.target.classList.contains("searchAddress")) return;                     // 주소 검색 버튼을 누른 게 아니면 무시.
        const addressInput = e.target.closest("fieldset").querySelector(".address");   // 누른 버튼과 같은 참가자 칸의 주소 입력칸.
        new daum.Postcode({                                                            // 주소 검색 팝업 생성.
            oncomplete: (data) => { addressInput.value = data.roadAddress; }           // 주소를 고르면 도로명 주소를 주소 칸에 넣는다.
        }).open();                                                                     // 팝업 열기.
    });

</script>
</body>
</html>
