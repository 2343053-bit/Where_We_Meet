<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common(#{title.signup})}"></th:block>
    <style>
        .signup-form {
            width: 360px;
            margin: 40px auto;
            padding: 24px;
            border: 1px solid #aaa;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .signup-form label {
            display: block;
            margin-top: 12px;
        }

        .signup-form input {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .signup-form button {
            width: 100%;
            margin-top: 16px;
            padding: 8px;
        }

        .address-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .address-row button {
            width: auto;
            margin-top: 0;
            white-space: nowrap;
        }
        .required-mark {
            color: red;
            font-weight: bold;
            margin-left: 0.2em;
        }
        .signup-form {
            position: relative;
        }

        .signup-errors {
            position: absolute;
            top: 24px;
            left: calc(100% + 16px);
            width: 240px;
            color: red;
        }

        .signup-errors p {
            margin: 0 0 8px;
        }

        @media (max-width: 700px) {
            .signup-errors {
                position: static;
                width: auto;
                margin-bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>
    <p id="signup-error"
   th:if="${errorMessage != null}"
   th:text="#{${errorMessage}}"
   hidden></p>

    <form class="signup-form" th:action="@{/signup}" th:object="${memberForm}" method="post">
        <div class="signup-errors"
            th:if="${errorMessage != null or #fields.hasErrors('*')}">
            <p th:if="${errorMessage != null}"
            th:text="#{${errorMessage}}"></p>
            <p th:each="error : ${#fields.errors('*')}"
            th:text="${error}"></p>
        </div>
        
        <label for="id"><span th:text="#{member.id}">아이디:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{id}" id="id" required>

        <label for="username"><span th:text="#{member.username}">이름:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{username}" id="username" required>

        <label for="nickname"><span th:text="#{member.nickname}">닉네임:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{nickname}" id="nickname" required>

        <label for="password"><span th:text="#{member.password}">비밀번호:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="password" th:field="*{password}" id="password" required>

        <label for="email"><span th:text="#{member.email}">이메일:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="email" th:field="*{email}" id="email" required>

        <label for="phoneNumber"><span th:text="#{member.phoneNumber}">전화번호:</span><span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required>

        <label for="address" th:text="#{member.address}">주소:</label>
        <div class="address-row">
            <input type="text" th:field="*{address}" id="address" readonly required>
            <button type="button" id="searchAddress" th:text="#{member.searchAddress}">주소 검색</button>
        </div>

        <button type="submit" th:text="#{signup.submit}">회원가입</button>
    </form>
    <script th:src="@{/js/member/signupError.js}"></script>
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:src="@{/js/member/addressSearch.js}"></script>
</body>

</html>
