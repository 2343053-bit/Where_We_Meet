<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common('회원가입')}"></th:block>
    <style>
        .signup-form {
            width: 360px;
            margin: 40px auto;
            padding: 24px;
            border: 1px solid #aaa;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .signup-form label {
            display: block;
            margin-top: 12px;
        }

        .signup-form input {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .signup-form button {
            width: 100%;
            margin-top: 16px;
            padding: 8px;
        }

        .address-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .address-row button {
            width: auto;
            margin-top: 0;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>
    <form class="signup-form" th:action="@{/signup}" th:object="${memberForm}" method="post">
        <label for="username">아이디:</label>
        <input type="text" th:field="*{username}" id="username" required>

        <label for="nickname">닉네임:</label>
        <input type="text" th:field="*{nickname}" id="nickname" required>

        <label for="password">비밀번호:</label>
        <input type="password" th:field="*{password}" id="password" required>

        <label for="email">이메일:</label>
        <input type="email" th:field="*{email}" id="email" required>

        <label for="phoneNumber">전화번호:</label>
        <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required>

        <label for="address">주소:</label>
        <div class="address-row">
            <input type="text" th:field="*{address}" id="address" readonly required>
            <button type="button" id="searchAddress">주소 검색</button>
        </div>

        <button type="submit">회원가입</button>
    </form>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:src="@{/js/member/addressSearch.js}"></script>
</body>

</html>
