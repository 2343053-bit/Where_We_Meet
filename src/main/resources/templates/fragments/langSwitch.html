<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 언어 전환 (한국어 | English). 상단 메뉴(fragments/header.html)에서 th:replace 한 줄로 불러 쓴다.
     - 지금 보고 있는 주소 뒤에 ?lang= 만 붙여서 다시 연다. 고른 언어는 쿠키에 기억된다. (config/LocaleConfig.java)
     - "?lang=en" 처럼 물음표로 시작하는 주소는 "지금 페이지 + 이 값" 이라는 뜻이다.
       th:href="@{...}" 는 경로를 만들어 주는 기능이라, 경로가 없는 이 링크에는 쓰지 않았다. (가이드 H12 의 예외)
     - 주의: 결과 화면(제출 후)에서 누르면 페이지를 새로 열기 때문에 결과가 사라진다.
     - 언어를 추가하려면: 아래에 링크 한 줄 + messages_xx.properties 파일 + 두 사전에 lang.xx 키를 추가한다. -->
<div th:fragment="langSwitch" class="lang-switch">
    <!-- th:text="#{키}" : 지금 언어의 사전(messages*.properties)에서 키를 찾아 글자를 바꿔 넣는다. -->
    <a href="?lang=ko" th:text="#{lang.ko}">한국어</a> |
    <a href="?lang=en" th:text="#{lang.en}">English</a>
</div>
</html>
