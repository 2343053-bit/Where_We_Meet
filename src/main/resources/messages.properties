# =====================================================================
# 다국어 사전 - 기본(한국어)
#   키=문장  형식. 화면에서는 키만 쓰고(템플릿 #{키}, JS t('키')), 실제 문장은 여기서 찾는다.
#   영어는 messages_en.properties 에 같은 키로 적는다. (키가 빠지면 이 파일의 한국어가 대신 나온다)
#   {0}, {1} 은 빈칸. 숫자나 이름을 나중에 끼워 넣는다. (언어마다 어순이 달라서 문장 전체를 사전에 둔다)
# =====================================================================

# ── 상단 메뉴 (fragments/header.html) ──
header.login=로그인
header.signup=회원가입

# ── 언어 전환 ── (자기 언어 이름은 어느 화면에서든 그 언어로 보여 준다)
lang.ko=한국어
lang.en=English

# ── 참가자 입력칸 (fragments/participant.html) ──
participant.legend=참가자 {0}
participant.namePlaceholder=이름
participant.addressPlaceholder=주소 (예: 부산 사하구 낙동대로 550)
participant.searchAddress=주소 검색

# ── 주변 장소 패널 (fragments/placePanel.html) ──
panel.title=주변 장소
panel.searching=장소를 찾는 중...
panel.empty=참가자 위치를 제출하면 중간 지점 주변 장소가 여기에 표시됩니다.
panel.viewOnKakaoMap=카카오맵에서 보기
panel.share=공유

# ── JS 에서 쓰는 문장 ──
#   JS 는 #{키} 를 직접 못 쓰므로, fragments/jsMessages.html 에 키를 적어 두면 서버가 번역해서 JS 에 넘긴다.
#   JS 에서는 util/i18n.js 의 t('키') 로 꺼낸다. 새 키를 추가하면 jsMessages.html 에도 한 줄 추가해야 한다.

# 카페 클릭 → 경로 (map/carRoutes.js)
route.calculating=승용차 경로 계산 중...
route.minutes=승용차 {0}분
route.none=경로 없음
route.loadFailed=경로를 불러오지 못했습니다.
