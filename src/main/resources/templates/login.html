<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common(#{title.login})}"></th:block>
</head>


<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>

    <form th:action="@{/login}" method="post">
        <label for="username" th:text="#{member.username}">아이디:</label>
        <input type="text" name="username" id="username" required><br>

        <label for="password" th:text="#{member.password}">비밀번호:</label>
        <input type="password" name="password" id="password" required><br>

        <button type="submit" th:text="#{login.submit}">로그인</button>
    </form>
</body>

</html>
