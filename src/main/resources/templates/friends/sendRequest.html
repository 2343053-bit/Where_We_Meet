<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common(#{friend.request.send.title})}"></th:block>
</head>

<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>

    <main>
        <h1 th:text="#{friend.request.send.heading}">친구 요청 보내기</h1>

        <div class="sub-nav">
            <a th:href="@{/friends}" th:text="#{friend.list.back}">친구 목록으로</a>
            <a th:href="@{/friends/requests/received}" th:text="#{friend.request.received}">받은 친구 요청</a>
        </div>

        <div th:if="${errorMessageKey != null}" class="alert alert--error">
            <p th:text="#{${errorMessageKey}}">오류 메시지</p>
        </div>

        <div th:if="${successMessageKey != null}" class="alert alert--success">
            <p th:text="#{${successMessageKey}}">성공 메시지</p>
        </div>

        <form th:action="@{/friends/requests/new}" method="post">
            <label for="friendId" th:text="#{friend.request.send.label}">친구 ID</label>
            <input type="text"
                   id="friendId"
                   name="friendId"
                   required
                   pattern=".*\S.*"
                   th:placeholder="#{friend.request.send.placeholder}"
                   placeholder="요청할 친구 ID 입력" />
            <button type="submit" th:text="#{friend.request.send.button}">요청 보내기</button>
        </form>
    </main>
</body>

</html>
