<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="card card-narrow">
        <h1>로그인</h1>

        <div class="alert alert-error" th:if="${param.error}">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-block">로그인</button>
        </form>

        <p class="center muted">
            계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
