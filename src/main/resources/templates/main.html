<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>참가자 입력</title>
</head>
<body>
<form th:action="@{/result}" th:object="${participantForm}" method="post">
    <fieldset>
        <legend>참가자 1</legend>
        <label>이름
            <input type="text" th:field="*{participants[0].participantName}" required>
        </label>
        <label>위도
            <input type="number" step="any" th:field="*{participants[0].latitude}" required>
        </label>
        <label>경도
            <input type="number" step="any" th:field="*{participants[0].longitude}" required>
        </label>
    </fieldset>

    <fieldset>
        <legend>참가자 2</legend>
        <label>이름
            <input type="text" th:field="*{participants[1].participantName}" required>
        </label>
        <label>위도
            <input type="number" step="any" th:field="*{participants[1].latitude}" required>
        </label>
        <label>경도
            <input type="number" step="any" th:field="*{participants[1].longitude}" required>
        </label>
    </fieldset>

    <button type="submit">제출</button>
</form>
</body>
</html>
