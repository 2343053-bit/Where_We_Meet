<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common(#{title.main})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- fetch 로 POST 할 때 보낼 보안 토큰. (api/meetingPointApi.js 가 읽는다)-->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
</head>


<body>
    <header
        th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}">
    </header>
    <!-- 중간 지점을 옮겼거나, 옮길 곳을 못 찾았을 때 안내. -->
    <th:block th:if="${meetingPoint != null}">
        <p class="meeting-notice" role="status" th:if="${meetingPoint.adjusted}"
            th:text="#{meeting.adjusted(${meetingPoint.anchorName})}">○○역 기준으로 찾았어요.</p>
        <p class="meeting-notice meeting-notice--warning" role="status" th:if="${meetingPoint.anchorMissing}"
            th:text="#{meeting.anchorMissing}">만날 곳을 찾지 못했어요.</p>
    </th:block>

    <!-- 폼(왼쪽) | 지도(가운데) | 주변 장소 패널(오른쪽). 패널 HTML 은 fragments/placePanel.html 에 있다. -->
    <main id="layout">
        <!-- id="participantForm" : 아래 스크립트에서 제출 이벤트를 가로채려고 폼에 id 를 붙였다. -->
        <form id="participantForm" th:action="@{/main}" th:object="${participantForm}" method="post">
            <label for="keyword" th:text="#{search.keyword}">검색어:</label>
            <input type="text" th:field="*{keyword}" id="keyword" th:placeholder="#{search.keywordPlaceholder}">

            <div id="participants">
                <th:block th:each="p, stat : *{participants}">
                    <fieldset th:replace="~{fragments/participant :: participant(${stat.index}, ${stat.count}, ${p})}">
                    </fieldset>
                </th:block>
            </div>
            <!-- + 버튼이 복제해서 쓰는 빈 입력칸. @INDEX@ / @NUM@ 은 JS 가 번호로 바꾼다. -->
            <template id="participant-template">
                <fieldset th:replace="~{fragments/participant :: participant('@INDEX@', '@NUM@', null)}"></fieldset>
            </template>

            <button type="button" id="removeParticipant">-</button>
            <button type="button" id="addParticipant">+</button>
            <button type="submit" th:text="#{search.submit}">제출</button>
        </form>

        <!-- 가운데: 지도 + 현재 위치 오류 안내 -->
        <section id="map-column">
            <div id="map"></div>
            <p id="current-location-status" role="status" hidden></p>
        </section>

        <!-- 오른쪽: 주변 장소 패널 -->
        <aside th:replace="~{fragments/placePanel :: placePanel(${meetingPoint != null})}"></aside>
    </main>

    <!-- 지도 스크립트는 반드시 폼 "뒤"에 둔다. 폼 앞에 긴 스크립트가 있으면 Thymeleaf 가 화면을 먼저 보내 버려서
     폼의 보안 토큰(CSRF)을 못 만들고 화면이 잘린다. ("Cannot create a session after the response has been committed") -->
    <!-- 장소 검색 기능은 기본 지도에 들어 있지 않아서 libraries='services' 를 추가해야 한다. -->
    <script th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoJsKey},libraries='services')}"></script>
    <!-- 다음(카카오) 우편번호 서비스. "주소 검색" 버튼을 누르면 뜨는 주소 검색 팝업(daum.Postcode)을 쓰려고 추가했다. (키 필요 없음) -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
        <!-- th:inline="javascript" : 이 <script> 안에서도 Thymeleaf 가 서버 값을 넣어 주도록 켜는 설정
    (없으면 아래 /*[[...]]*/ 부분이 그대로 브라우저로 가서 주석 취급 → 값이 항상 null.) -->

    <script th:inline="javascript">
        window.APP_DATA = { // window.APP_DATA : 전역 변수로 만들어서 다른 스크립트에서도 접근 가능.
            meetingPoint: /*[[${meetingPoint}]]*/ null,
            participants: /*[[${participantForm?.participants}]]*/[]
        };
    </script>
    <!-- JS 에서 쓰는 번역 문장 (APP_DATA.messages). APP_DATA 뒤, main.js 앞에 둔다. -->
    <script th:replace="~{fragments/jsMessages :: jsMessages}"></script>
    <script type="module" th:src="@{/js/main.js}"></script>
</body>

</html>
