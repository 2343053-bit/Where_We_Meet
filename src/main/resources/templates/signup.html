<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<form th:action="@{/signup}" th:object="${memberForm}" method="post">
    <label for="id">아이디:</label>
    <input type="text" th:field="*{id}" id="id" required><br>

    <label for="nickname">닉네임:</label>
    <input type="text" th:field="*{nickname}" id="nickname" required><br>

    <label for="password">비밀번호:</label>
    <input type="password" th:field="*{password}" id="password" required><br>

    <button type="submit">회원가입</button>
</form>
</body>
</html>
