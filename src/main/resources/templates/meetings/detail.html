<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('만남 상세')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>스터디 모임</h1>
            <p>2026-11-02 · 샘플 장소 A · 3명</p>
        </div>
        <div class="row">
            <a th:href="@{/meetings}" class="btn btn-outline btn-small">목록</a>
            <!-- TODO: 삭제는 DELETE /meetings/{id} (fetch 또는 숨은 _method 필드) -->
            <form th:action="@{/meetings/1/delete}" method="post"
                  onsubmit="return confirm('이 만남 기록을 삭제할까요?');">
                <button type="submit" class="btn btn-danger btn-small">삭제</button>
            </form>
        </div>
    </div>

    <div class="stack">

        <section class="card">
            <h2>위치</h2>
            <!-- TODO: 카카오 지도를 여기에 표시한다 (지도 담당) -->
            <div class="map-placeholder">지도 영역</div>
        </section>

        <section class="card">
            <h2>참가자별 이동시간</h2>
            <table class="table">
                <thead><tr><th>참가자</th><th>출발지</th><th>이동시간</th></tr></thead>
                <tbody>
                    <tr><td>참가자 A</td><td>샘플 출발지 1</td><td>28분</td></tr>
                    <tr><td>참가자 B</td><td>샘플 출발지 2</td><td>33분</td></tr>
                    <tr><td>참가자 C</td><td>샘플 출발지 3</td><td>30분</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>만남 사진</h2>
            <!-- TODO: 파일 로직 담당 - 확장자(jpg, png)·크기 검증, 저장 파일명은 UUID 로 변경 -->
            <form th:action="@{/meetings/1/photos}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="photo">사진 업로드</label>
                    <input type="file" id="photo" name="file" accept="image/png, image/jpeg" required>
                    <div class="form-hint">JPG, PNG · 최대 5MB</div>
                </div>
                <button type="submit" class="btn btn-small">업로드</button>
            </form>

            <ul class="file-list" style="margin-top:16px">
                <li>
                    <span>meeting_01.jpg</span>
                    <span class="spacer muted">1.2MB</span>
                    <a th:href="@{/files/1/download}">다운로드</a>
                </li>
                <li>
                    <span>meeting_02.png</span>
                    <span class="spacer muted">0.8MB</span>
                    <a th:href="@{/files/2/download}">다운로드</a>
                </li>
            </ul>
        </section>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
