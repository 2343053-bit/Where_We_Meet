<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: common('회원정보 수정')}"></th:block>
</head>

<body>
    <header th:replace="${isAuthenticated} ? ~{fragments/header_mypage :: siteHeader} : ~{fragments/header :: siteHeader}"></header>

    <main>
        <p th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

        <form th:action="@{/mypage/edit}" th:object="${memberForm}" method="post">
            <fieldset>
                <legend>회원정보 수정</legend>

                <p>
                    <label for="nickname">닉네임:</label><br>
                    <input type="text" th:field="*{nickname}" id="nickname" required>
                </p>

                <p>
                    <label for="phoneNumber">휴대전화:</label><br>
                    <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required>
                </p>

                <p>
                    <label for="email">이메일:</label><br>
                    <input type="email" th:field="*{email}" id="email" required>
                </p>

                <p>
                    <label for="address">주소:</label><br>
                    <input type="text" th:field="*{address}" id="address" readonly required>
                    <button type="button" id="searchAddress">주소 검색</button>
                </p>

                <button type="submit">저장</button>
                <a th:href="@{/mypage}">취소</a>
            </fieldset>
        </form>
    </main>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        document.getElementById("searchAddress").addEventListener("click", () => {
            new daum.Postcode({
                oncomplete: (data) => {
                    document.getElementById("address").value =
                        data.roadAddress || data.jibunAddress || data.address;
                }
            }).open();
        });
    </script>
</body>

</html>
