<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- JS 에서 쓰는 번역 문장을 서버가 번역해서 window.APP_DATA.messages 에 넘겨 주는 조각.
     - JS 파일은 Thymeleaf 를 거치지 않아서 #{키} 를 못 쓴다. 그래서 여기서 대신 번역해 배달한다.
     - #{키} : 지금 언어의 사전(messages*.properties)에서 찾은 문장. ${...}(서버 값)와 다르다.
     - JS 에서는 util/i18n.js 의 t('키') 로 꺼낸다.
     - 새 문장이 필요하면: 두 사전 파일에 키 추가 → 여기에 한 줄 추가 → JS 에서 t('키').
     - 페이지에서는 APP_DATA 를 만드는 스크립트 "뒤", main.js 를 불러오기 "앞" 에 th:replace 한 줄로 넣는다. -->
<script th:fragment="jsMessages" th:inline="javascript">
    window.APP_DATA = window.APP_DATA || {};   // APP_DATA 가 아직 없으면 빈 객체로 만든다. (있으면 그대로 두고 messages 만 추가)
    window.APP_DATA.messages = {
        // 카페 클릭 → 경로 (map/carRoutes.js)
        'route.calculating': /*[[#{route.calculating}]]*/ '',
        'route.minutes':     /*[[#{route.minutes}]]*/ '',
        'route.none':        /*[[#{route.none}]]*/ '',
        'route.loadFailed':  /*[[#{route.loadFailed}]]*/ '',

        // 현재 위치 안내 (map/currentLocation.js)
        'location.denied':      /*[[#{location.denied}]]*/ '',
        'location.timeout':     /*[[#{location.timeout}]]*/ '',
        'location.failed':      /*[[#{location.failed}]]*/ '',
        'location.insecure':    /*[[#{location.insecure}]]*/ '',
        'location.unsupported': /*[[#{location.unsupported}]]*/ '',

        // 제출 경고창 (participants/submit.js)
        'submit.noAddress':       /*[[#{submit.noAddress}]]*/ '',
        'submit.addressNotFound': /*[[#{submit.addressNotFound}]]*/ '',

        // 주변 장소 카드 (map/placePanel.js)
        'panel.share':      /*[[#{panel.share}]]*/ '',
        'panel.copied':     /*[[#{panel.copied}]]*/ '',
        'panel.copyFailed': /*[[#{panel.copyFailed}]]*/ '',
        'panel.distance':   /*[[#{panel.distance}]]*/ '',
        'panel.noResult':   /*[[#{panel.noResult}]]*/ '',
        'panel.loadFailed': /*[[#{panel.loadFailed}]]*/ '',
        'panel.photoLabel': /*[[#{panel.photoLabel}]]*/ '',

        // 중간 지점 말풍선 (map/resultMarkers.js)
        'result.averagePoint':     /*[[#{result.averagePoint}]]*/ '',
        'result.meetingPoint':     /*[[#{result.meetingPoint}]]*/ '',

        // 현위치 말풍선 (map/CoorsdtoAddr.js)
        'location.addressLoading':  /*[[#{location.addressLoading}]]*/ '',
        'location.addressNotFound': /*[[#{location.addressNotFound}]]*/ '',
        'location.here':            /*[[#{location.here}]]*/ '',
        'location.roadAddress':     /*[[#{location.roadAddress}]]*/ '',
        'location.jibunAddress':    /*[[#{location.jibunAddress}]]*/ '',
        'location.none':            /*[[#{location.none}]]*/ '',

        // 장소 종류 큰 분류. 키 끝은 카카오 category_group_code (map/placePanel.js)
        'category.MT1': /*[[#{category.MT1}]]*/ '',
        'category.CS2': /*[[#{category.CS2}]]*/ '',
        'category.PS3': /*[[#{category.PS3}]]*/ '',
        'category.SC4': /*[[#{category.SC4}]]*/ '',
        'category.AC5': /*[[#{category.AC5}]]*/ '',
        'category.PK6': /*[[#{category.PK6}]]*/ '',
        'category.OL7': /*[[#{category.OL7}]]*/ '',
        'category.SW8': /*[[#{category.SW8}]]*/ '',
        'category.BK9': /*[[#{category.BK9}]]*/ '',
        'category.CT1': /*[[#{category.CT1}]]*/ '',
        'category.AG2': /*[[#{category.AG2}]]*/ '',
        'category.PO3': /*[[#{category.PO3}]]*/ '',
        'category.AT4': /*[[#{category.AT4}]]*/ '',
        'category.AD5': /*[[#{category.AD5}]]*/ '',
        'category.FD6': /*[[#{category.FD6}]]*/ '',
        'category.CE7': /*[[#{category.CE7}]]*/ '',
        'category.HP8': /*[[#{category.HP8}]]*/ '',
        'category.PM9': /*[[#{category.PM9}]]*/ ''
    };

    // 지금 언어 코드. ${...} 는 서버 값이고, #locale 은 Thymeleaf 가 알려 주는 지금 Locale(언어)이다. → "ko" / "en"
    window.APP_DATA.lang = /*[[${#locale.language}]]*/ 'ko';
</script>
</html>
