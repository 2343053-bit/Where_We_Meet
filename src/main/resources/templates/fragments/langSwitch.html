<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 언어 전환 (한국어 | English). 상단 메뉴(fragments/header.html)에서 th:replace 한 줄로 불러 쓴다.
     - 지금 보고 있는 주소 뒤에 ?lang= 만 붙여서 다시 연다. 고른 언어는 쿠키에 기억된다. (config/LocaleConfig.java)
     - "?lang=en" 처럼 물음표로 시작하는 주소는 "지금 페이지 + 이 값" 이라는 뜻이다.
       th:href="@{...}" 는 경로를 만들어 주는 기능이라, 경로가 없는 이 링크에는 쓰지 않았다. (가이드 H12 의 예외)
     - main 화면에서 결과를 본 뒤 언어를 바꾸면 js/util/langSwitch.js 가 결과를 잠깐 저장했다가 새 언어 화면에서 다시 그린다.
       그 JS 가 data-lang 링크를 찾으므로, 링크를 추가할 때 data-lang 도 같이 붙인다.
     - 언어를 추가하려면: 아래에 링크 한 줄 + messages_xx.properties 파일 + 두 사전에 lang.xx 키를 추가한다. -->
<div th:fragment="langSwitch" class="lang-switch">
    <!-- th:text="#{키}" : 지금 언어의 사전(messages*.properties)에서 키를 찾아 글자를 바꿔 넣는다.
         th:classappend="조건 ? '클래스'" : 조건이 참일 때만 class 에 이름을 덧붙인다. (거짓이면 아무것도 안 붙임)
         #locale.language : 지금 언어 코드("ko" / "en"). 지금 언어 링크에 is-active 를 붙여 css/base.css 에서 굵게 보여 준다. -->
    <a href="?lang=ko" data-lang="ko" th:text="#{lang.ko}"
       th:classappend="${#locale.language == 'ko'} ? 'is-active'">한국어</a> |
    <a href="?lang=en" data-lang="en" th:text="#{lang.en}"
       th:classappend="${#locale.language == 'en'} ? 'is-active'">English</a>
</div>
</html>
