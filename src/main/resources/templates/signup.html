<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="card card-narrow">
        <h1>회원가입</h1>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <!-- TODO: 회원가입 기능을 만들 때 th:object + @Valid + th:errors 로 서버 검증을 붙인다 -->
        <form th:action="@{/signup}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username"
                       required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+">
                <div class="form-hint">영문, 숫자, 밑줄 4~20자</div>
            </div>
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" required maxlength="20">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required minlength="8">
                <div class="form-hint">8자 이상</div>
            </div>
            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            </div>
            <button type="submit" class="btn btn-block">가입하기</button>
        </form>

        <p class="center muted">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
