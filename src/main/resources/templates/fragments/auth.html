<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    로그인 / 회원가입 폼 조각
    - 단독 페이지(/login, /signup)와 메인 화면 모달(main.html)에서 같이 사용한다.
    - 두 폼이 한 페이지(메인)에 동시에 들어가므로 input id 는 login-*, signup-* 로 구분한다.
    - data-modal 링크: 메인 화면에서는 main.js 가 가로채서 모달을 전환하고,
      단독 페이지에서는 일반 링크로 이동한다.
-->

<div th:fragment="loginForm" class="auth-form">
    <h1>로그인</h1>

    <!-- /login?error (단독 페이지) 또는 /?login=error (메인 모달) -->
    <div class="alert alert-error"
         th:if="${param.error != null or (param.login != null and param.login[0] == 'error')}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div class="alert alert-success" th:if="${param.logout}">
        로그아웃되었습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="login-username">아이디</label>
            <input type="text" id="login-username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-block">로그인</button>
    </form>

    <p class="center muted">
        계정이 없으신가요? <a th:href="@{/signup}" data-modal="signup">회원가입</a>
    </p>
</div>

<div th:fragment="signupForm" class="auth-form">
    <h1>회원가입</h1>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <!-- TODO: 회원가입 기능을 만들 때 th:object + @Valid + th:errors 로 서버 검증을 붙인다 -->
    <form th:action="@{/signup}" method="post">
        <div class="form-group">
            <label for="signup-username">아이디</label>
            <input type="text" id="signup-username" name="username" autofocus autocomplete="username"
                   required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+">
            <div class="form-hint">영문, 숫자, 밑줄 4~20자</div>
        </div>
        <div class="form-group">
            <label for="signup-nickname">닉네임</label>
            <input type="text" id="signup-nickname" name="nickname" required maxlength="20" autocomplete="nickname">
        </div>
        <div class="form-group">
            <label for="signup-password">비밀번호</label>
            <input type="password" id="signup-password" name="password" required minlength="8" autocomplete="new-password">
            <div class="form-hint">8자 이상</div>
        </div>
        <div class="form-group">
            <label for="signup-passwordConfirm">비밀번호 확인</label>
            <input type="password" id="signup-passwordConfirm" name="passwordConfirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-block">가입하기</button>
    </form>

    <p class="center muted">
        이미 계정이 있으신가요? <a th:href="@{/login}" data-modal="login">로그인</a>
    </p>
</div>

</body>
</html>
