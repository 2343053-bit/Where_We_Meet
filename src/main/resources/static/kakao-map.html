<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도 API 테스트</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: #666;
        }

        #map {
            width: 100%;
            height: 600px;
        }

        #error-message {
            display: none;
            padding: 16px 20px;
            color: #b42318;
            background: #fef3f2;
        }
    </style>
</head>
<body>
<header>
    <h1>카카오 지도 API 테스트</h1>
    <p>Spring Boot static 리소스에서 카카오 지도를 불러옵니다.</p>
</header>

<div id="error-message" role="alert"></div>
<div id="map"></div>

<script>
    function showMapError(message) {
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
    }

    function initMap() {
        const mapContainer = document.getElementById('map');
        const center = new kakao.maps.LatLng(37.5665, 126.9780);
        const map = new kakao.maps.Map(mapContainer, {
            center: center,
            level: 5
        });

        new kakao.maps.Marker({
            map: map,
            position: center
        });
    }

    window.addEventListener('error', function (event) {
        if (event.filename && event.filename.includes('dapi.kakao.com')) {
            showMapError('카카오 지도 API를 불러오지 못했습니다. JavaScript 키와 허용 도메인을 확인하세요.');
        }
    });
</script>
<script async
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1a1bbdcc18c78dde64d56522ec5c1740&autoload=false"
        onload="kakao.maps.load(initMap)"
        onerror="showMapError('카카오 지도 SDK 로드에 실패했습니다. 네트워크와 JavaScript 키를 확인하세요.')">
</script>
</body>
</html>
